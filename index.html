<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTRAL — App de controle de obras (desktop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8E6; --panel:#FFFFFF; --ink:#141414; --muted:#574F3F; --line:#E8DDB8;
  --yellow:#FFC72C; --orange:#FF7F11; --cream:#FFF3CF; --black:#141414; --white:#FFFFFF;
  --display:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --text:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17150F;--panel:#252116;--ink:#FFF8E6;--muted:#D3CAAE;--line:#3B3625}
}
:root[data-theme="dark"]{--bg:#17150F;--panel:#252116;--ink:#FFF8E6;--muted:#D3CAAE;--line:#3B3625}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.5;position:relative;overflow:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0}
p{margin:0}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px}

/* ---------- deck ---------- */
.deck{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:none;overflow:auto;padding:clamp(28px,4vw,56px) clamp(20px,5vw,72px) 104px;background:var(--bg)}
.slide.active{display:block}
.slide::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(-45deg,var(--black) 0 12px,var(--yellow) 12px 24px)}
.wrap{max-width:1120px;margin:0 auto;min-height:100%;display:grid;align-content:center;gap:32px}
.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(28px,6vw,80px);align-items:center}
.split.flip{grid-template-columns:auto minmax(0,1fr)}
.split.flip .phone-col{order:-1}
.kicker{display:inline-block;font-weight:800;font-size:15px;background:var(--yellow);color:var(--black);padding:4px 14px;border-radius:999px;border:2px solid var(--black);margin-bottom:14px}
h2{font-size:clamp(32px,4.6vw,52px);margin-bottom:16px}
.lead{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:52ch}
.notes{list-style:none;margin:28px 0 0;padding:0;max-width:56ch}
.notes li{padding:14px 0;border-top:2px solid var(--line)}
.notes li:last-child{border-bottom:2px solid var(--line)}
.notes b{font-family:var(--display);font-weight:600;font-size:20px;display:block;margin-bottom:2px}
.notes span{color:var(--muted);font-size:17px}
.tag{font-weight:800;font-size:14px;color:var(--ink);background:var(--cream);border:1.5px solid var(--line);border-radius:8px;padding:1px 8px;white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{background:#3B3120}}
:root[data-theme="dark"] .tag{background:#3B3120}

/* capa */
.cover{background:var(--yellow);color:var(--black)}
.cover::before{height:20px;background:repeating-linear-gradient(-45deg,var(--black) 0 14px,var(--yellow) 14px 28px)}
.cover .lead{color:#2B2514}
.cover h1{font-size:clamp(64px,11vw,136px);letter-spacing:.01em;margin:10px 0 6px}
.cover .tagline{font-family:var(--display);font-weight:600;font-size:clamp(24px,3.2vw,38px);line-height:1.15;max-width:18ch;margin-bottom:18px}
.cover .logo-row{display:flex;align-items:center;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chips span{background:var(--white);border:2.5px solid var(--black);border-radius:999px;padding:4px 16px;font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--black)}

/* ---------- phone ---------- */
.phone-col{display:grid;justify-items:center;gap:14px}
.phone{width:324px;height:660px;background:var(--black);border-radius:48px;padding:12px;box-shadow:0 26px 40px -18px rgba(0,0,0,.45);flex:none}
.screen{width:100%;height:100%;background:#fff;border-radius:38px;overflow:hidden;position:relative;color:var(--black)}
@media (max-height:820px){.phone{zoom:.86}}
.app{height:100%;overflow-y:auto;display:flex;flex-direction:column;background:#fff;color:var(--black);font-family:var(--text);font-size:16px;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.status{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;padding:12px 26px 0}
.status i{display:inline-block;width:24px;height:12px;border:2px solid var(--black);border-radius:4px;position:relative}
.status i::after{content:"";position:absolute;inset:1px;right:6px;background:var(--black);border-radius:1px}
.hero{background:var(--yellow);border-radius:0 0 30px 30px;padding:0 22px 22px;border-bottom:3px solid var(--black)}
.hero .brand{display:flex;align-items:center;gap:10px;margin:14px 0 14px}
.hero .brand b{font-family:var(--display);font-size:24px;letter-spacing:.04em}
.hero h3{font-size:28px;margin-bottom:4px}
.hero p{font-size:15px;line-height:1.35;font-weight:700}
.form{padding:18px 20px 22px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.lbl{font-weight:800;font-size:14px}
.inp{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border:2.5px solid var(--black);border-radius:14px;background:#fff}
.inp:focus-within{box-shadow:0 0 0 3px var(--orange)}
.inp svg{flex:none}
.inp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;font-weight:700;color:var(--black);height:46px}
.inp input::placeholder{color:#7A725E;font-weight:600}
.field.bad .inp{border-color:#B3261E;background:#FFF1EF}
.help,.err{font-size:13px;line-height:1.3;font-weight:700;color:#5B5442}
.err{color:#B3261E;display:none}
.field.bad .err{display:block}
.field.bad .help{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:3px solid var(--black);border-radius:16px;background:var(--orange);color:var(--black);font-family:var(--display);font-weight:600;font-size:21px;cursor:pointer;box-shadow:0 5px 0 var(--black);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--black)}
.btn.alt{background:#fff}
.btn[disabled]{background:#E9E4D3;color:#5E5848;border-color:#8A8370;box-shadow:0 5px 0 #8A8370;cursor:not-allowed}
.btn[disabled]:active{transform:none;box-shadow:0 5px 0 #8A8370}
.linkbtn{background:none;border:0;min-height:48px;font-weight:800;font-size:16px;color:var(--black);text-decoration:underline;text-underline-offset:4px;cursor:pointer;width:100%}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px 0}
.back{width:48px;height:48px;border-radius:14px;border:2.5px solid var(--black);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.steps{flex:1;display:grid;gap:4px}
.steps small{font-weight:800;font-size:13px}
.bar{height:10px;background:#EFE8D0;border:2px solid var(--black);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--orange)}
.bar.half i{width:50%}
.ask{padding:14px 20px 4px}
.ask h3{font-size:27px;margin-bottom:4px}
.ask p{font-size:15px;line-height:1.35;font-weight:700;color:#4A4434}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 20px 10px}
.pcard{position:relative;display:grid;justify-items:center;align-content:center;gap:6px;min-height:104px;padding:10px 6px;border:2.5px solid var(--black);border-radius:18px;background:#fff;cursor:pointer;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1;color:var(--black);text-align:center;box-shadow:0 4px 0 var(--black);transition:transform .08s,box-shadow .08s,background .12s}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--black)}
.pcard .ico{width:48px;height:48px}
.pcard .tick{position:absolute;top:-10px;right:-8px;width:28px;height:28px;border-radius:50%;background:var(--orange);border:2.5px solid var(--black);display:none;place-items:center}
.pcard[aria-pressed="true"]{background:var(--cream);border-width:3.5px;box-shadow:0 4px 0 var(--orange),0 0 0 3px var(--orange)}
.pcard[aria-pressed="true"] .tick{display:grid}
.pad{padding:6px 20px 22px}
.pad .btn{margin-top:4px}

.done{flex:1;display:grid;align-content:center;justify-items:center;text-align:center;gap:12px;padding:20px 24px 28px}
.done .big{width:96px;height:96px;border-radius:50%;background:var(--yellow);border:3px solid var(--black);display:grid;place-items:center;box-shadow:0 5px 0 var(--black)}
.done h3{font-size:28px}
.done p{font-size:16px;font-weight:700;line-height:1.4}
.done .note{background:var(--cream);border:2px dashed var(--black);border-radius:14px;padding:10px 12px;font-size:14px;min-height:0}
.done .note:empty{display:none}
.done .btn{margin-top:8px}

.cap{font-size:15px;font-weight:700;color:var(--muted);text-align:center;max-width:320px}
.reset{background:none;border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 18px;font-weight:800;font-size:15px;cursor:pointer;min-height:44px}

/* perfis depois */
.grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:8px}
.role-card{background:var(--panel);border:2.5px solid var(--ink);border-radius:20px;padding:18px 18px 20px;box-shadow:0 5px 0 var(--ink)}
.role-card:nth-child(2n){border-radius:20px 28px 20px 28px}
.role-card .ico{width:52px;height:52px;margin-bottom:8px}
.role-card h3{font-size:24px;margin-bottom:4px}
.role-card p{font-size:16px;color:var(--muted);line-height:1.4}

/* paleta */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);border:3px solid var(--ink);border-radius:22px;overflow:hidden;min-height:190px}
.sw{padding:16px 14px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.sw b{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.sw span{font-size:15px;font-weight:800}
.sw small{font-size:14px;font-weight:700;opacity:.9;line-height:1.25}
.specs{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}
.type-demo .d{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05}
.type-demo .n{font-size:18px;color:var(--muted);margin-top:8px;max-width:40ch}
.type-demo small{display:block;margin-top:10px;font-size:15px;color:var(--muted)}
.btn-demo{display:grid;gap:14px;max-width:340px}
.btn-demo .btn{font-size:20px}
.btn-demo .btn.alt{background:#fff}

/* ux */
.laws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.law{padding:16px 0 16px 18px;border-left:6px solid var(--orange);margin:10px 0}
.law:nth-child(3n+1){border-left-color:var(--yellow)}
.law h3{font-size:22px;margin-bottom:2px;font-weight:600}
.law p{font-size:17px;color:var(--muted);line-height:1.45}

/* ---------- app (abas) ---------- */
.shell{position:relative;overflow:hidden}
.ahead{background:var(--yellow);border-bottom:3px solid var(--black);border-radius:0 0 22px 22px;padding-bottom:10px;flex:none}
.arow{display:flex;align-items:center;gap:10px;padding:8px 16px 0}
.arow>div{flex:1;min-width:0}
.arow b{font-family:var(--display);font-size:19px;display:block;line-height:1.15}
.arow small{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{min-width:48px;min-height:44px;border:2.5px solid var(--black);border-radius:12px;background:#fff;color:var(--black);font-weight:800;font-size:13px;cursor:pointer;padding:0 8px;display:grid;place-items:center}
.pane{flex:1;overflow-y:auto;padding:14px 16px 16px;scrollbar-width:none}
.pane::-webkit-scrollbar{display:none}
.pane h3{font-size:25px;margin-bottom:2px}
.sub{font-size:14px;line-height:1.35;font-weight:700;color:#4A4434;margin-bottom:12px}
.quick{display:flex;gap:8px;align-items:stretch}
.quick .inp{flex:1;min-width:0}
.addbtn{width:56px;flex:none;border:3px solid var(--black);border-radius:14px;background:var(--orange);color:var(--black);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--black);transition:transform .08s,box-shadow .08s}
.addbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--black)}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.qc{min-height:40px;padding:0 12px;border:2.5px solid var(--black);border-radius:999px;background:var(--cream);color:var(--black);font-family:var(--text);font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.qc:active{background:var(--yellow)}
.mcount{font-family:var(--display);font-weight:600;font-size:17px;margin:14px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.mcount small{font-family:var(--text);font-weight:800;font-size:13px;color:#4A4434}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mi{display:flex;align-items:center;gap:8px;padding:8px;border:2.5px solid var(--black);border-radius:16px;background:#fff}
.mi.urgent{background:#FFF1DD;box-shadow:inset 6px 0 0 var(--orange);padding-left:12px}
.mi.done{background:#F3F0E4;border-style:dashed}
.mi.done .mt b{text-decoration:line-through;color:#5E5848}
.chk,.ib{flex:none;border:2.5px solid var(--black);border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--black)}
.chk{width:44px;height:44px}
.chk svg{opacity:0}
.chk[aria-pressed="true"]{background:var(--yellow)}
.chk[aria-pressed="true"] svg{opacity:1}
.ib{width:42px;height:44px;border-color:#8A8370}
.ib[aria-pressed="true"]{background:var(--orange);border-color:var(--black)}
.mt{flex:1;min-width:0}
.mt b{font-weight:800;font-size:16px;line-height:1.2;display:block}
.mt small{font-size:13px;font-weight:700;color:#5B5442;display:block}
.badge{display:inline-block;font-size:12px;font-weight:800;background:var(--orange);border:2px solid var(--black);border-radius:99px;padding:0 8px;margin-top:3px;color:var(--black)}
.empty{text-align:center;padding:18px 12px;border:2.5px dashed #8A8370;border-radius:16px;font-weight:700;font-size:15px;line-height:1.35;color:#4A4434}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--black);background:#fff}
.tab{min-height:64px;display:grid;justify-items:center;align-content:center;gap:2px;border:0;background:#fff;font-family:var(--display);font-weight:600;font-size:14px;cursor:pointer;color:var(--black)}
.tab+.tab{border-left:3px solid var(--black)}
.tab[aria-selected="true"]{background:var(--orange)}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--black);color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:4}
.toast.on{opacity:1}
.mh{margin-bottom:8px}
.mh h3{font-size:22px}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk span{text-align:center;font-weight:800;font-size:13px;color:#4A4434;padding-bottom:4px}
.day{min-height:46px;border:2.5px solid var(--black);border-radius:10px;background:#fff;display:grid;grid-template-rows:auto 1fr;justify-items:center;align-items:center;padding:2px 0;cursor:pointer;color:var(--black);font-family:var(--text);font-weight:800;font-size:13px}
.day svg{width:16px;height:16px}
.day.e{border-color:#8A8370;border-style:dashed}
.day.w{background:var(--yellow)}
.day.r{background:var(--black);color:#fff}
.day.p{background:var(--orange)}
.day.today{box-shadow:0 0 0 2px #fff,0 0 0 4.5px var(--black)}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:16px 0 8px}
.lg{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.lg i{width:26px;height:26px;border:2.5px solid var(--black);border-radius:8px;display:grid;place-items:center;font-style:normal}
.lg i svg{width:14px;height:14px}
.lg i.w{background:var(--yellow)}
.lg i.r{background:var(--black);color:#fff}
.lg i.p{background:var(--orange)}
.whyh{font-family:var(--display);font-weight:600;font-size:17px;margin:12px 0 6px}
.why{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.why li{font-size:14px;font-weight:700;line-height:1.3;padding:8px 10px;border:2px solid var(--black);border-radius:12px;display:flex;gap:8px}
.why li b{flex:none}
.nudge{width:100%;min-height:48px;border:2.5px dashed var(--black);border-radius:14px;background:var(--cream);font-family:var(--text);font-weight:800;font-size:14px;cursor:pointer;margin-bottom:12px;text-align:left;padding:8px 12px;color:var(--black)}
.scrim{position:absolute;inset:0;background:rgba(20,20,20,.55);z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:3px solid var(--black);border-radius:24px 24px 0 0;padding:14px 16px 18px;max-height:94%;overflow-y:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sheet-h h4{font-family:var(--display);font-size:19px;margin:0;line-height:1.15}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{min-height:84px;border:2.5px solid var(--black);border-radius:16px;background:#fff;display:grid;justify-items:center;align-content:center;gap:4px;font-family:var(--display);font-weight:600;font-size:15px;line-height:1.1;cursor:pointer;color:var(--black);box-shadow:0 3px 0 var(--black);padding:4px}
.opt svg{width:28px;height:28px}
.opt[aria-pressed="true"]{box-shadow:0 0 0 3px var(--orange),0 3px 0 var(--black)}
.opt.w[aria-pressed="true"]{background:var(--yellow)}
.opt.r[aria-pressed="true"]{background:var(--black);color:#fff}
.opt.p[aria-pressed="true"]{background:var(--orange)}
.rs{margin-top:12px}
.rs .lbl{display:block;margin-bottom:6px}
.rchips{display:flex;flex-wrap:wrap;gap:8px}
.rc{min-height:44px;padding:0 12px;border:2.5px solid var(--black);border-radius:999px;background:#fff;font-family:var(--text);font-weight:800;font-size:14px;cursor:pointer;color:var(--black)}
.rc[aria-pressed="true"]{background:var(--cream);box-shadow:0 0 0 3px var(--orange)}

/* construcoes e somente leitura */
.ocard{width:100%;display:flex;align-items:center;gap:10px;padding:10px;min-height:68px;border:2.5px solid var(--black);border-radius:16px;background:#fff;color:var(--black);text-align:left;cursor:pointer;font-family:var(--text);box-shadow:0 4px 0 var(--black);transition:transform .08s,box-shadow .08s}
.ocard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--black)}
.ocard[aria-pressed="true"]{background:var(--cream);box-shadow:0 0 0 3px var(--orange),0 4px 0 var(--black)}
.oic{width:44px;height:44px;flex:none;border:2.5px solid var(--black);border-radius:12px;background:var(--yellow);display:grid;place-items:center}
.robox{margin:0 0 12px;padding:8px 12px;border:2.5px dashed var(--black);border-radius:14px;background:var(--cream);font-size:14px;font-weight:700;line-height:1.3}
.robox b{font-weight:800}
.day.ro{cursor:default}
.tabbar.g4 .tab{font-size:12.5px}
.tabbar.g4{grid-template-columns:repeat(4,1fr)}
.mecard{display:flex;gap:12px;align-items:center;padding:12px;border:2.5px solid var(--black);border-radius:16px;background:var(--yellow);box-shadow:0 4px 0 var(--black)}
.av{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--black);background:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;flex:none}
.mecard b{font-family:var(--display);font-size:20px;display:block;line-height:1.15}
.mecard small{display:block;font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.perm{display:flex;flex-wrap:wrap;gap:6px}
.pm{font-size:13px;font-weight:800;background:var(--cream);border:2px solid var(--black);border-radius:99px;padding:1px 10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.kpi{border:2.5px solid var(--black);border-radius:14px;padding:8px 4px;text-align:center;background:#fff}
.kpi small{display:block;font-size:11px;font-weight:800;line-height:1.2}
.kpi b{font-family:var(--display);font-size:16px;line-height:1.2}
.kpi.hot{background:var(--yellow)}
.bars{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px}
.bars li{position:relative;border:2px solid var(--black);border-radius:10px;overflow:hidden;padding:5px 10px;font-weight:800;font-size:13px;display:flex;justify-content:space-between}
.bars li i{position:absolute;left:0;top:0;bottom:0;background:var(--yellow)}
.bars li span,.bars li b{position:relative}
.aih{display:flex;align-items:center;gap:8px}
.aih b{font-family:var(--display);font-size:18px}
.chat{display:grid;gap:8px;margin:10px 0}
.msg{padding:8px 10px;border:2px solid var(--black);border-radius:14px;font-size:14px;font-weight:700;line-height:1.35;max-width:92%}
.msg.me{justify-self:end;background:var(--cream)}
.msg.ia{background:#fff}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.nav .step{width:52px;height:52px;border-radius:50%;border:3px solid var(--black);background:var(--yellow);color:var(--black);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 var(--black)}
.nav .step:active{transform:translateY(3px);box-shadow:0 1px 0 var(--black)}
.nav .step[disabled]{opacity:.45;cursor:not-allowed}
.dots{display:flex;gap:2px;align-items:center}
.dots button{width:28px;height:44px;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center}
.dots button i{display:block;width:12px;height:12px;border-radius:50%;background:transparent;border:2.5px solid var(--ink)}
.dots button[aria-current="true"] i{background:var(--orange);width:26px;border-radius:99px}
.count{font-weight:800;font-size:15px;min-width:48px;text-align:center}

@media (max-width:900px){
  .split,.split.flip{grid-template-columns:1fr;justify-items:center}
  .split.flip .phone-col{order:0}
  .split>div:not(.phone-col){justify-self:stretch}
  .grid6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .swatches{grid-template-columns:1fr 1fr}
  .sw{min-height:120px}
  .specs,.laws{grid-template-columns:1fr}
  .count{display:none}
}
@media (max-width:520px){
  .grid6{grid-template-columns:1fr}
  .phone{zoom:.92}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* design do site da ASTRAL: geometria quadrada */
*,*::before,*::after{border-radius:0!important}
.phone{border-radius:48px!important}
.screen{border-radius:38px!important}
/* ---------- desktop ---------- */
#desk{position:absolute;inset:0;display:grid;place-items:center;overflow:auto}
#proto{position:relative;width:min(440px,94vw);height:min(700px,96vh);background:#fff;border:3px solid var(--black);overflow:hidden;box-shadow:0 8px 0 var(--black);color:var(--black)}
#proto .status{display:none}
body.in #proto{width:100vw;height:100vh;border:0;box-shadow:none}
body.in .shell{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"side head" "side pane"}
body.in .ahead{grid-area:head;padding-bottom:12px}
body.in .ahead .status{display:none}
body.in .arow{padding:14px 28px}
body.in .arow b{font-size:24px}
body.in .arow small{font-size:15px}
body.in .pane{grid-area:pane;padding:24px 32px 40px}
body.in .pane h3{font-size:32px}
body.in .sub{font-size:16px}
body.in .tabbar,body.in .tabbar.g4{grid-area:side;display:flex;flex-direction:column;justify-content:flex-start;border-top:0;border-right:3px solid var(--black);padding-top:12px}
body.in .tab,body.in .tabbar.g4 .tab{flex:none;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;min-height:58px;padding:0 24px;font-size:17px;text-align:left}
body.in .tab+.tab{border-left:0;border-top:2px solid var(--line)}
body.in .toast{left:auto;right:24px;bottom:24px;width:320px}
body.in .sheet{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(520px,92vw);border:3px solid var(--black);max-height:88vh}
body.in .pane .mlist{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
body.in .mecard,body.in .quick{max-width:560px}
body.in .cg,body.in .wk,body.in .legend,body.in .why{max-width:820px}
body.in .day{min-height:76px;font-size:16px}
body.in .day svg{width:20px;height:20px}
body.in .kpis{grid-template-columns:repeat(4,1fr);gap:14px}
body.in .kpi{padding:14px 8px}
body.in .kpi small{font-size:14px}
body.in .kpi b{font-size:28px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:22px}
.chart{border:2.5px solid var(--black);background:#fff;padding:14px 16px}
.chart h4{font-family:var(--display);font-size:19px;margin:0 0 10px}
.chart svg{display:block;width:100%;height:auto}
.ch text{font-family:var(--text);font-weight:800;font-size:12px;fill:#141414}
.dn{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dn svg{width:170px;flex:none}
.astor{max-width:760px}
body.in .chart .bars{margin:0}
@media (max-width:1100px){.cgrid{grid-template-columns:1fr}body.in .kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<template id="tpl-login">
  <div class="app">
    <div class="status"><span>9:41</span><i aria-hidden="true"></i></div>
    <div class="hero">
      <div class="brand"><svg width="40" height="40" aria-hidden="true"><use href="#i-logo"/></svg><b>ASTRAL</b></div>
      <h3 tabindex="-1">Bem-vindo à obra!</h3>
      <p>Entre para acompanhar tudo em um só lugar.</p>
    </div>
    <div class="form">
      <label class="field" data-f="email">
        <span class="lbl">E-mail</span>
        <span class="inp"><svg width="24" height="24" aria-hidden="true"><use href="#i-user"/></svg><input name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="Ex.: maria@empresa.com.br"></span>
        <span class="err">Digite um e-mail válido, como nome@empresa.com.br.</span>
      </label>
      <label class="field" data-f="senha">
        <span class="lbl">Senha</span>
        <span class="inp"><svg width="24" height="24" aria-hidden="true"><use href="#i-lock"/></svg><input name="senha" type="password" autocomplete="current-password" placeholder="Sua senha"></span>

      <button type="button" class="btn" data-act="enter">Entrar</button>
      <button type="button" class="linkbtn" data-act="forgot">Esqueci minha senha</button>

<script>
(function(){
  /* ---------- telas ---------- */
  function tpl(name){return document.getElementById('tpl-'+name).content.cloneNode(true)}

  document.querySelectorAll('[data-static]').forEach(function(el){
    var kind=el.getAttribute('data-static');
    if(kind==='login'){ el.appendChild(tpl('login')); }
    else {
      el.appendChild(tpl('profile'));
      var c=el.querySelector('[data-role="Mestre de obra"]');
      c.setAttribute('aria-pressed','true');
      el.querySelector('[data-act="go"]').disabled=false;
    }
    el.setAttribute('inert','');
    el.setAttribute('role','img');
    el.setAttribute('aria-label', kind==='login' ? 'Tela de login do app Astral' : 'Tela de seleção de perfil do app Astral');
  });

  /* ---------- protótipo ---------- */
  var proto=document.getElementById('proto');
  var data={email:'',senha:'',role:''};

  function show(name){
    proto.innerHTML=''; proto.appendChild(tpl(name));
    var h=proto.querySelector('h3'); if(h) h.focus({preventScroll:true});
    if(name==='login'){
      proto.querySelector('[name=email]').value=data.email;
      proto.querySelector('[name=senha]').value=data.senha;
    }
    if(name==='profile' && data.role){
      var c=proto.querySelector('[data-role="'+data.role+'"]');
      if(c){c.setAttribute('aria-pressed','true'); proto.querySelector('[data-act="go"]').disabled=false;}
    }
    if(name==='done'){
      proto.querySelector('[data-o=nome]').textContent=firstName();
      proto.querySelector('[data-o=role]').textContent=data.role;
    }
  }
  function firstName(){return (PERSONAS[data.role]||PERSONAS['Mestre de obra']).nome.split(' ')[0]}
  function maskTel(v){
    var d=v.replace(/\D/g,'').slice(0,11), o='';
    if(d.length>0) o='('+d.slice(0,2);
    if(d.length>=3) o+=') '+d.slice(2, d.length>10?7:6);
    if(d.length>(d.length>10?7:6)) o+='-'+d.slice(d.length>10?7:6);
    return o;
  }
  function setBad(name,bad){
    var f=proto.querySelector('[data-f="'+name+'"]'); if(!f) return;
    f.classList.toggle('bad',bad);
    var i=f.querySelector('input'); if(bad) i.setAttribute('aria-invalid','true'); else i.removeAttribute('aria-invalid');
  }
  proto.addEventListener('input',function(e){
    var t=e.target; if(t.tagName!=='INPUT') return;
    data[t.name]=t.value;
    if(t.value.trim()) setBad(t.name,false);
  });
  proto.addEventListener('click',function(e){
    var card=e.target.closest('.pcard');
    if(card){
      proto.querySelectorAll('.pcard').forEach(function(c){c.setAttribute('aria-pressed','false')});
      card.setAttribute('aria-pressed','true');
      data.role=card.getAttribute('data-role');
      proto.querySelector('[data-act="go"]').disabled=false;
      return;
    }
    var b=e.target.closest('[data-act]'); if(!b) return;
    var act=b.getAttribute('data-act');
    if(act==='enter'){
      var okL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(data.email.trim());
      var okS=data.senha.length>=4;
      setBad('email',!okL); setBad('senha',!okS);
      if(okL&&okS) show('profile');
      else { var first=proto.querySelector('.field.bad input'); if(first) first.focus(); }
    }
    if(act==='forgot'){
      var f=proto.querySelector('[data-f="senha"] .help');
      f.textContent='Peça uma nova senha ao gerente Astral da sua obra.';
    }
    if(act==='back') show('login');
    if(act==='go' && data.role) show('done');
    if(act==='see'){ enterApp(); }
    if(act==='restart'){ data={email:'',senha:'',role:''}; show('login'); }
  });
  show('login');
  proto.querySelector('h3') && document.activeElement && document.activeElement.blur();

  /* ---------- app com abas: Materiais e Calendário ---------- */
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function ic(n,s){s=s||24;return '<svg width="'+s+'" height="'+s+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  var DOW=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  function dayLabel(d){return cap(DOW[new Date(2026,8,d).getDay()])+', '+d+' de setembro'}
  var TODAY=30, KIND={w:'Trabalhado',r:'Choveu',p:'Obra parada'}, KICON={w:'ok',r:'rain',p:'pause'};
  var QUICK=['Cimento','Areia','Tijolo','Tinta','Cano PVC','Fio elétrico'];
  var PAUSE_WHY=['Falta de material','Falta de equipe','Feriado','Equipamento quebrado','Outro motivo'];

      h+='<div class="kpis"><div class="kpi"><small>Prazo original</small><b>'+a.orig+'</b></div><div class="kpi hot"><small>Novo prazo</small><b>'+a.novo+'</b></div><div class="kpi"><small>Dias perdidos</small><b>'+nf(a.lost)+'</b></div><div class="kpi"><small>Dias trabalhados</small><b>'+cnt.w+'</b></div></div>';
      h+='<div class="cgrid">'+box('Dias perdidos acumulados em setembro',lineChart(days));
      h+=box('Situação dos dias',donut([{n:'Trabalhados',v:cnt.w,c:'#FFC72C'},{n:'Chuva',v:cnt.r,c:'#141414'},{n:'Parados',v:cnt.p,c:'#FF7F11'},{n:'Sem registro',v:30-cnt.w-cnt.r-cnt.p,c:'#E9E4D3'}]));
      h+=box('Causas dos dias perdidos',cs.length?'<ul class="bars">'+cs.map(function(x){return '<li><i style="width:'+Math.round(a.c[x]/tot*100)+'%"></i><span>'+x+'</span><b>'+nf(a.c[x])+'</b></li>'}).join('')+'</ul>':'<div class="empty">Nenhum dia perdido até agora.</div>');
      h+=box('Prazo por obra: original e recalculado',deadlines())+'</div>';
      h+='<div class="astor"><div class="aih"><span class="oic">'+ic('chart',24)+'</span><b>Astor</b></div><p class="sub" style="margin-top:4px">Responde com base no calendário e nos materiais desta obra.</p>';
      h+='<div class="qchips">'+Object.keys(QL).map(function(k){return '<button type="button" class="qc" data-act="a-ask" data-q="'+k+'">'+QL[k]+'</button>'}).join('')+'</div>';
      h+='<div class="chat">'+(st.chat.length?st.chat.map(function(m){return '<div class="msg me">'+esc(m.q)+'</div><div class="msg ia">'+m.a+'</div>'}).join(''):'<div class="msg ia">Olá! Sou o Astor. Posso recalcular o prazo de entrega com base nos dias sem trabalho.</div>')+'</div>';
      h+='<div class="quick"><span class="inp"><input name="ask" type="text" autocomplete="off" aria-label="Pergunte ao Astor" placeholder="Pergunte ao Astor" value="'+esc(st.askDraft)+'"></span><button type="button" class="addbtn" data-act="a-askgo" aria-label="Enviar pergunta">'+ic('next',24)+'</button></div></div>';
      return h;
    }
    function paneHtml(){
      if(st.tab==='ana' && st.role===GEST) return anaHtml();
      if(st.tab==='mat') return matHtml();
      if(st.tab==='cal') return calHtml();
      return homeHtml();
    }

    /* --- estrutura --- */
    function tabBtn(t,icn,label){return '<button type="button" role="tab" class="tab" data-act="a-tab" data-t="'+t+'" aria-selected="'+(st.tab===t)+'">'+ic(icn,24)+label+'</button>'}
    var KEYS=['data-act','data-i','data-t','data-n','data-d','data-w','data-q'];
    function render(keep){
      var oldPane=w.querySelector('.pane'), sc=(keep&&oldPane)?oldPane.scrollTop:0;
      var oldSheet=w.querySelector('.sheet'), ssc=oldSheet?oldSheet.scrollTop:0;
      var fsel=null, ae=document.activeElement;
      if(ae && w.contains(ae) && ae.getAttribute && ae.getAttribute('data-act')){
        fsel=KEYS.map(function(k){return ae.hasAttribute(k)?'['+k+'="'+ae.getAttribute(k)+'"]':''}).join('');
      }
      var h='<div class="ahead"><div class="status"><span>9:41</span><i aria-hidden="true"></i></div><div class="arow"><svg width="36" height="36" aria-hidden="true"><use href="#i-logo"/></svg><div><b>'+(st.obra===null?'Escolha sua obra':esc(OBRAS[st.obra].nome))+'</b><small>'+esc(st.role)+' · '+esc(st.user)+'</small></div>'+(o.onExit?'<button type="button" class="xbtn" data-act="a-exit">Sair</button>':'')+'</div></div>';
      h+='<div class="pane">'+paneHtml()+'</div>';
      h+='<div class="tabbar'+(st.role===GEST?' g4':'')+'" role="tablist" aria-label="Abas da obra">'+tabBtn('home','home','Home')+tabBtn('mat','box','Materiais')+tabBtn('cal','cal','Calendário')+(st.role===GEST?tabBtn('ana','chart','Análise'):'')+'</div>';
      h+='<div class="toast" role="status"></div>';
      if(st.sheet) h+=sheetHtml();
      w.innerHTML=h;
      var np=w.querySelector('.pane'); if(np) np.scrollTop=sc;
      var ns=w.querySelector('.sheet'); if(ns) ns.scrollTop=ssc;
      if(fsel){var el=w.querySelector(fsel); if(el) el.focus({preventScroll:true});}
    }

    w.addEventListener('click',function(e){
      var b=e.target.closest('[data-act]'); if(!b||!w.contains(b)) return;
      var a=b.getAttribute('data-act'), id=+b.getAttribute('data-i');
      if(st.ro && /^a-(add|q|chk|flag|del|day|type|why|save|clear)$/.test(a)) return;
      if(a==='a-tab'){st.tab=b.getAttribute('data-t'); st.sheet=null; render(false);}
      else if(a==='a-obra'){pick(id); render(true); toast(OBRAS[st.obra].nome+' selecionada.');}
      else if(a==='a-ask'){ask(b.getAttribute('data-q'),'');}
      else if(a==='a-askgo'){if(!st.askDraft.trim()){toast('Digite sua pergunta.');return;} ask('',st.askDraft.trim());}
      else if(a==='a-add'){addMat(st.draft,true);}
      else if(a==='a-q'){addMat(b.getAttribute('data-n'),false);}
      else if(a==='a-chk'){st.mats.forEach(function(m){if(m.id===id){m.done=!m.done; if(m.done) m.urgent=false;}}); render(true);}
      else if(a==='a-flag'){st.mats.forEach(function(m){if(m.id===id) m.urgent=!m.urgent}); render(true);}
      else if(a==='a-del'){st.mats=st.mats.filter(function(m){return m.id!==id}); render(true); toast('Material removido.');}
      else if(a==='a-day'){openSheet(+b.getAttribute('data-d'));}
      else if(a==='a-close'){st.sheet=null; render(true);}
      else if(a==='a-type'){
        var t=b.getAttribute('data-t'); st.sheet.t=t;
        if(t==='w') st.sheet.why='';
        if(t==='r' && RAIN_WHY.indexOf(st.sheet.why)<0) st.sheet.why='Dia todo';
        if(t==='p' && PAUSE_WHY.indexOf(st.sheet.why)<0) st.sheet.why='';
        render(true);
      }
      else if(a==='a-why'){st.sheet.why=b.getAttribute('data-w'); render(true);}
      else if(a==='a-save'){
        var s=st.sheet; if(!s.t||(s.t==='p'&&!s.why)) return;
        st.days[s.d]={t:s.t,why:s.t==='w'?'':s.why,note:(s.note||'').trim()};
        st.sheet=null; render(true); toast('Dia '+s.d+' salvo.');
      }
      else if(a==='a-clear'){var d0=st.sheet.d; delete st.days[d0]; st.sheet=null; render(true); toast('Registro do dia '+d0+' limpo.');}
      else if(a==='a-exit'){ if(o.onExit) o.onExit(); }
    });
    w.addEventListener('input',function(e){
      var t=e.target;
      if(t.name==='mat') st.draft=t.value;
      if(t.name==='ask') st.askDraft=t.value;
      if(t.name==='note' && st.sheet) st.sheet.note=t.value;
    });
    w.addEventListener('keydown',function(e){
      if(e.key==='Enter' && e.target.name==='ask'){e.preventDefault(); if(st.askDraft.trim()) ask('',st.askDraft.trim());}
      if(e.key==='Enter' && e.target.name==='mat'){e.preventDefault(); addMat(st.draft,true);}
      if(e.key==='Escape' && st.sheet){st.sheet=null; render(true);}
    });
    render(false);
  }

  function enterApp(){
    document.body.classList.add('in');
    createApp(proto,{tab:'home',email:data.email,role:data.role||'Mestre de obra',
      onExit:function(){document.body.classList.remove('in'); data={email:'',senha:'',role:''}; show('login');}});
  }
  document.querySelectorAll('[data-app]').forEach(function(el){
    createApp(el,{tab:el.getAttribute('data-app'),role:el.getAttribute('data-role')||undefined});
  });

})();
</script>
</body>
</html>
